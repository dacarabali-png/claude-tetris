<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <label class="panel-section theme-toggle">
          <input type="checkbox" id="theme-toggle" />
          Modo claro
        </label>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="name-entry" class="name-entry hidden">
          <p class="name-entry-label">¡Nuevo record! Ingresa tu nombre:</p>
          <input type="text" id="name-input" maxlength="12" value="Jugador" />
          <button id="save-score-btn">Guardar</button>
        </div>

        <div class="records-block">
          <div class="records-stats">
            <span><span class="label">MEJOR COMBO</span><span class="value" id="overlay-best-combo">0</span></span>
            <span><span class="label">MAX LÍNEAS</span><span class="value" id="overlay-max-lines">0</span></span>
          </div>
          <table class="records-table" id="overlay-records-table">
            <tbody></tbody>
          </table>
        </div>

        <button id="restart-btn">Reiniciar</button>
        <button id="reset-records-btn-overlay" class="reset-records-btn">Borrar records</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>

        <div class="records-block">
          <div class="records-stats">
            <span><span class="label">MEJOR COMBO</span><span class="value" id="start-best-combo">0</span></span>
            <span><span class="label">MAX LÍNEAS</span><span class="value" id="start-max-lines">0</span></span>
          </div>
          <table class="records-table" id="start-records-table">
            <tbody></tbody>
          </table>
        </div>

        <button id="play-btn">Jugar</button>
        <button id="reset-records-btn-start" class="reset-records-btn">Borrar records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
